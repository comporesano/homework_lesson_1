name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv black isort flake8 mypy pytest pytest-cov

      - name: Set up environment
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run linting
        run: |
          # Для black используем явное исключение через extend-exclude
          python -m black --check --extend-exclude="/(\.venv|venv|build|dist)/" .

          # Для isort используем skip
          python -m isort --check-only --skip .venv --skip venv .

          # Для flake8 используем exclude в конфиге или аргументе
          python -m flake8 --exclude=.venv,venv,build,dist .

          python -m mypy --ignore-missing-imports .

      - name: Run tests
        run: |
          python -m pytest --cov=./ --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
